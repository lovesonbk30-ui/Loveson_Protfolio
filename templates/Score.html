<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Team Quiz Scoreboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #FFEFA8;
        }
        h1 {
            color: red;
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 20px;
        }
        .scoreboard-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto 30px auto;
        }
        .score-board {
            background: #2c3e50;
            color: white;
            width: 280px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            text-align: center;
            position: relative;
        }
        .team-name-form {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }
        .team-name-input {
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            background: transparent;
            border: 1px dashed #7f8c8d;
            border-radius: 4px;
            text-align: center;
            padding: 4px;
            width: 100%;
        }
        .team-name-input:focus {
            outline: none;
            background: #34495e;
            border-style: solid;
            border-color: #f1c40f;
        }
        .score-display {
            font-size: 2.5rem;
            font-weight: bold;
            margin: 15px 0;
            color: #f1c40f;
        }
        .actions {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 15px;
        }
        .btn {
            border: none;
            padding: 8px 12px;
            font-size: 0.9rem;
            font-weight: bold;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:hover {
            opacity: 0.85;
        }
        .add { background-color: #2ecc71; }
        .reset { background-color: #e67e22; }
        .delete-team { background-color: #e74c3c; }
        .update-btn { background-color: #3498db; font-size: 0.8rem; }
        
        .add-team-wrapper {
            text-align: center;
            margin-top: 20px;
        }
        .add-team-btn {
            background-color: #9b59b6;
            font-size: 1.1rem;
            padding: 12px 24px;
        }
        .Series{
        padding: 15px;
        text-align: center;
        justify-content:center;
        margin: 50px auto;
        background: white;
        border-radius: 20px;
        width: 700px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h2{
        color: orange;
        font-size:2rem
        }
        input{
        padding: 8px;
        border-radius: 20px;
        font-size: 20px;
        width: 550px;
        text-align: center;
        }
        .numb-btn{
        padding: 8px;
        background: blue;
        color: white;
        font-size: 26px;
        width: 95%;
        border: none;
        border-radius: 18px;
        margin: 14px;
        cursor: pointer;
        transition: opacity 0.2s;
        }
       
        .numb-btn:hover{
        background: #3F09B9;
        opacity: 0.85;
        }
        h3{
        color: red;
        font-size: 22px;
        }
        .numbers{
        display: flex;
        flex-wrap: wrap;
        margin-top: 20px;
        gap: 10px;
        justify-content: center;
        }
        .sub-numb{
        width: 50px;
        height: 45px;
        background: #f5f5f5;
        border-radius: 14px;
        font-size: 24px;
        user-select: none;
        display: flex;
        text-align: center;
        justify-content: center;
        transition: 0.2s;
        
        }
        .sub-numb a{
        text-decoration: none;
        color: black;
        }
         .sub-numb:hover {
            transform: scale(1.08);
            background: #ffe0bd;
        }
        .sub-numb.clicked{
        color: red;
        background: #ffe5e5;
            }
 .creator{
text-align:center;
background: #27272A;
color: orange;
padding: 2px;
font-size: 1.5rem;
margin-top: 1000px;
font-weight: bold;
}
.creator span{
font-size: 1.6rem;
color: white;
font-weight: bold;
}
.creator p{
font-size: 20px;
color: #E0DFE2;
margin-top: 1px;
}
     

    </style>
</head>
<body>
    <h1>QUIZ SCOREBOARD:</h1>
   

<div class='Series'>
<h2> 🔢Choose your lucky number </h2>
<form method='POST' action = {{url_for('score')}}>
<input type='number' name='number' placeholder='Enter your desired number'> <br> 
<button class='numb-btn' type='submit'> Generate </button>
</form>


{% if number %}
<h3> Numbers up to {{number}} </h3>

<div class='numbers'>
{% for i in range(1, number+1) %}
<div class='sub-numb' onclick="this.classList.toggle('clicked')">
   <a href='#score-id' >  {{i}} </a>
</div>
{%endfor%}
</div>
{%endif%}
</div>

   <section id='score-id'>
    <div class="scoreboard-container">
   
          {% for team in teams %}
        <div class="score-board">
            <!-- Edit Team Name -->
            <form action="{{ url_for('update_team', team_id=team.id) }}" method="POST" class="team-name-form">
                <input 
                    type="text" 
                    name="team_name" 
                    value="{{ team.name }}" 
                    class="team-name-input" 
                    required 
                />
                <button type="submit" class="btn update-btn">Save</button>
            </form>

            <!-- Score Display -->
            <div class="score-display">{{ team.score }}</div>

            <!-- Score Adjustments & Controls -->
            <div class="actions">
                <form action="{{ url_for('add_score', team_id=team.id) }}" method="POST" style="display:inline;">
                    <input type="hidden" name="points" value="5">
                    <button type="submit" class="btn add">+5</button>
                </form>
                
                <form action="{{ url_for('add_score', team_id=team.id) }}" method="POST" style="display:inline;">
                    <input type="hidden" name="points" value="10">
                    <button type="submit" class="btn add">+10</button>
                </form>

                <form action="{{ url_for('reset_score', team_id=team.id) }}" method="POST" style="display:inline;">
                    <button type="submit" class="btn reset">Reset</button>
                </form>

                <form action="{{ url_for('delete_team', team_id=team.id) }}" method="POST" style="display:inline;">
                    <button type="submit" class="btn delete-team">X</button>
                </form>
            </div>
        </div>
        {% endfor %}
    </div>

    <!-- Global Add Team Control -->
    <div class="add-team-wrapper">
        <form action="{{ url_for('add_team') }}" method="POST">
            <button type="submit" class="btn add-team-btn">+ Add New Team</button>
        </form>
     
    </div>
    </section>   
    <footer class='creator'>
Designed by: <span> Loveson B.K. </span>
<p> ©All rights reserved to Loveson Site </p>
</footer>
</body>
</html>
